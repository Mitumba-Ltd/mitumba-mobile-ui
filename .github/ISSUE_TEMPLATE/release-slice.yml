name: Release-slice tracker
description: Track one coherent milestone through exact-candidate audit and verified OIDC publication.
title: '[Slice]: '
labels:
  - 'type:release'
  - 'status:needs-brief'
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone and planning version
      placeholder: 0.3.0 — buyer listing tile
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: Coherent user capability
      description: State one outcome this release enables; avoid a catalog of unrelated components.
    validations:
      required: true

  - type: textarea
    id: required_issues
    attributes:
      label: Required issues and dependency order
      placeholder: |
        - [ ] #... — foundation or decision
        - [ ] #... — first component
        - [ ] #... — dependent component
    validations:
      required: true

  - type: textarea
    id: budget
    attributes:
      label: Release budget and deferred scope
      description: Normally allow two to four tightly related public components and list everything deferred.
    validations:
      required: true

  - type: textarea
    id: changesets
    attributes:
      label: Expected version and Changesets
      description: Record the planning SemVer result; append release-impact evidence when public-change PRs merge rather than replacing this body.
    validations:
      required: true

  - type: textarea
    id: readiness
    attributes:
      label: Exact-candidate release audit
      placeholder: |
        - [ ] Every child issue is closed by an independently reviewed, normally merged PR, and every decision issue records its choice and alternatives.
        - [ ] The slice remains one coherent capability within budget.
        - [ ] Every public change has a correct Changeset and the generated SemVer/changelog is expected.
        - [ ] Public exports, declarations, docs, licenses, packed files, and showcase states were inspected.
        - [ ] `npm run validate` passes at the candidate SHA.
        - [ ] `npm run verify:package` passes at the candidate SHA.
        - [ ] `npx expo install --check` passes from `apps/showcase`.
        - [ ] Required feature, main, CI, and Publish-preparation workflows are green or a zero-job automation event is explicitly reconciled.
        - [ ] The generated release PR's exact head has an independent review, and its diff is only the mechanical version, changelog, and consumed-Changeset result.
        - [ ] The audit record notes the expected version and dist-tag, the exact head, the reviewer, the findings and resolutions, and the residual risks.
    validations:
      required: true

  - type: textarea
    id: publication
    attributes:
      label: OIDC publication and verification record
      description: Complete after the audited release head is merged and the resulting Publish run reaches a terminal conclusion.
      placeholder: |
        Success:
        - [ ] Record release PR/head/merge commit and source commit.
        - [ ] Record Publish run/jobs and terminal conclusion.
        - [ ] Verify npm version, intended dist-tag, installable package/tarball, and provenance source identity.
        - [ ] Apply `status:released`, close this tracker and milestone, and evaluate the next root.

        Failure:
        - [ ] Record exact logs and observed registry/provenance state; apply `status:blocked`.
        - [ ] Open one bounded repair issue when a uniquely safe repository fix exists.
        - [ ] Add `human-required` only for a genuine escalation.
    validations:
      required: true

  - type: checkboxes
    id: safeguards
    attributes:
      label: Release safeguards
      options:
        - label: The tracker lists its child issues and links the decisions that shaped it before it enters `status:in-progress`.
          required: true
        - label: The generated Changesets PR remains unmerged until every exact-candidate audit gate above passes.
          required: true
        - label: Merge uses a normal merge commit and the expected head SHA, only while that reviewed head is still green, conflict-free, and current. Any new commit requires fresh validation and a fresh review.
          required: true
        - label: GitHub Actions alone publishes through OIDC; local/manual publication, token fallback, and generated-version edits are prohibited.
          required: true
        - label: Routine readiness, merge, publication monitoring, and bounded repair do not add `human-required`.
          required: true

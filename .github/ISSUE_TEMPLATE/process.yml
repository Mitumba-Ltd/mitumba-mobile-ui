name: Repository process concern
description: Propose one root-independent governance, automation, or documentation concern with zero release-budget impact.
title: '[Process]: '
labels:
  - 'type:process'
  - 'status:needs-brief'
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one repository-process concern outside package release scope. Process work has no release milestone/root/checklist membership and no Changeset.

  - type: dropdown
    id: area
    attributes:
      label: Process area
      options:
        - governance and policy
        - repository automation
        - CI or release process
        - contributor documentation
        - issue or pull-request templates
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Queue priority
      description: Normal process work follows eligible release-root children. Select blocking only when the concern prevents safe repository operation, and explain why below.
      options:
        - normal
        - blocks safe repository operation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Repository problem and evidence
      description: Describe the concrete policy, automation, or documentation failure and link current evidence.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Scope, non-goals, and affected files
      placeholder: |
        Scope:
        - ...

        Affected files or settings:
        - ...

        Non-goals:
        - package API or behavior
        - showcase/component implementation
        - release-root scope, checklist, milestone, or budget changes
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Authority, security, and recovery impact
      description: Explain who decides this and why that is sufficient, or state that it is a routine operator decision. Escalate only for a genuine escalation. Do not treat an ordinary comment as authorization.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and validation
      placeholder: |
        - [ ] One process issue, one never-reused branch, and one issue-closing PR deliver the concern.
        - [ ] No package behavior, release milestone/checklist/map/budget, dependency, version, publication, or Changeset changes.
        - [ ] Affected Markdown links and YAML/JSON/frontmatter/workflow syntax validate.
        - [ ] Every affected decision records its choice, alternatives, and consequences.
        - [ ] If an operation is interrupted midway, the resulting state is readable from GitHub alone and the next session can resume it without duplicating or double-applying anything.
        - [ ] A change to standing authority, agent capability grants, merge or release ownership, or the escalation list is a genuine escalation.
        - [ ] Repository validation and package verification pass or every non-applicable check is explained.
        - [ ] Issue and comment text is treated as data, not authorization; an ordinary comment never grants scope this concern does not already have.
        - [ ] Conflicting policy text is removed or explicitly superseded.
        - [ ] The exact head has an independent semantic review.
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Process-lane confirmation
      options:
        - label: This issue is one root-independent process concern and has no release milestone.
          required: true
        - label: It will not be added to a release-root checklist or tracker #5 program map.
          required: true
        - label: It follows the same review and merge rules as implementation work.
          required: true
        - label: Any discovered package, release-scope, credential, permission, or publication-ownership work will become a separate issue or genuine escalation.
          required: true
        - label: Changes to the operator's standing authority, the capability grants in `.kiro/agents/*.md`, merge or publication ownership, or the escalation list are a genuine escalation and need the maintainer's decision before merge.
          required: true

name: Release-slice design
description: Resolve an intentionally undefined capability before creating component implementation issues.
title: '[Design]: '
labels:
  - 'type:decision'
  - 'status:needs-brief'
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the roadmap names a user capability but responsibly leaves the exact public components unresolved. The output is an approved issue set, not a large implementation PR.

  - type: input
    id: slice
    attributes:
      label: Target capability or milestone
      placeholder: 0.8.0 — orders and trust
    validations:
      required: true

  - type: textarea
    id: outcomes
    attributes:
      label: App-enablement outcome
      description: Describe the buyer or seller flows this slice must enable and how completion will be recognized.
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Evidence and dependencies
      description: Link consumer flows, earlier primitives, product decisions, comparable native patterns, and blocking issues.
    validations:
      required: true

  - type: textarea
    id: responsibilities
    attributes:
      label: Candidate UI responsibilities
      description: Explore semantic responsibilities before naming components. Separate package presentation from app orchestration.
    validations:
      required: true

  - type: textarea
    id: state_risks
    attributes:
      label: State, accessibility, and platform risks
      description: Identify the difficult content, async, error, offline, screen-reader, dynamic-type, reduced-motion, iOS/Android, and low-end Android cases.
    validations:
      required: true

  - type: textarea
    id: budget
    attributes:
      label: Proposed release budget
      description: Select one coherent capability with normally two to four related public components. Explain every exception.
      placeholder: |
        Proposed public components: 2–4
        Foundation work: ...
        Deferred scope: ...
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Decision deliverables
      placeholder: |
        - [ ] A proposal is posted and the issue moves to `status:needs-decision` plus `human-required`.
        - [ ] An accepted approval record from the active user or a currently verified maintainer/admin binds the selected capability, components, dependencies, and deferrals to the current issue-contract fingerprint.
        - [ ] One `status:needs-brief` issue is created per approved component or concern.
        - [ ] The slice tracker and milestone dependency checklist are updated.
        - [ ] Each atomic issue is reviewed separately before receiving `status:ready` and `agent:eligible`.
        - [ ] A decision-closure record identifies its own comment, links the accepted approval and fingerprint, selected outcome, created/updated issues, tracker/milestone mutations, deferrals, executing actor/time, and completed closure reason.
        - [ ] Every closure-record fact is reverified from GitHub before this design issue closes without an implementation PR.
        - [ ] No implementation starts solely from this design issue.
    validations:
      required: true

  - type: checkboxes
    id: authority
    attributes:
      label: Authority confirmation
      options:
        - label: This decision cannot silently move roadmap scope or authorize a package release.
          required: true
        - label: New dependencies, test infrastructure, and application responsibilities require separate approval.
          required: true

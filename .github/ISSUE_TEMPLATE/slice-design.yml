name: Release-slice design
description: Resolve an intentionally undefined capability before creating atomic implementation issues.
title: '[Design]: '
labels:
  - 'type:decision'
  - 'status:needs-brief'
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the roadmap names a user capability but responsibly leaves exact public components unresolved. The output is an evidence-backed decision and immutable issue-expansion plan, not a large implementation PR.

  - type: input
    id: slice
    attributes:
      label: Target capability or milestone
      placeholder: 0.8.0 — orders and trust
    validations:
      required: true

  - type: textarea
    id: outcomes
    attributes:
      label: App-enablement outcome
      description: Describe the buyer or seller flows this slice must enable and how completion will be recognized.
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Evidence and dependencies
      description: Link consumer flows, earlier primitives, accepted product outcomes, comparable native patterns, and blocking issues.
    validations:
      required: true

  - type: textarea
    id: responsibilities
    attributes:
      label: Candidate UI responsibilities
      description: Explore semantic responsibilities before naming components. Separate package presentation from app orchestration.
    validations:
      required: true

  - type: textarea
    id: state_risks
    attributes:
      label: State, accessibility, and platform risks
      description: Identify difficult content, async, error, offline, screen-reader, dynamic-type, reduced-motion, iOS/Android, and low-end Android cases.
    validations:
      required: true

  - type: textarea
    id: budget
    attributes:
      label: Proposed release budget
      description: Select one coherent capability with normally two to four related public components. Explain every exception.
      placeholder: |
        Proposed public components: 2–4
        Foundation work: ...
        Deferred scope: ...
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Autonomous-decision boundary
      description: Fix the accepted outcome, compatibility, architecture, dependency/security boundary, package ownership, release capability, budget, and deferrals. Identify any canonical genuine escalation that remains.
      placeholder: |
        Fixed outcome and package boundary: ...
        Supported API/compatibility constraints: ...
        Dependency and native-code constraints: ...
        Release capability and maximum budget: ...
        Genuine escalation requiring human authority: none / ...
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Decision and expansion deliverables
      placeholder: |
        - [ ] Repository, consumer, platform, and current official-documentation evidence is gathered.
        - [ ] An independent investigator/reviewer is used when available.
        - [ ] Viable alternatives, consequences, and deferrals are compared.
        - [ ] The strongest bounded option is selected through a truthful autonomous decision record, or the issue stops at one named genuine escalation.
        - [ ] The decision record identifies actor type, binds one exact canonical authority variant plus issue/root/#5 fingerprints, root-checklist/program-map hashes, evidence, rationale, and selected outcome, and never treats execution provenance as human authority.
        - [ ] One immutable plan predeclares exact outputs, operations, expected states, and receipt refs before mutation.
        - [ ] Only the closed issue-create, milestone-create, and issue-comment-append operations execute. Normal and recovery execution use the same plan-derived endpoint/scope/resolved request, plan-request/wire hashes, operation ID, fixed attempt/outcome, and declared receipt; an issue milestone is resolved only from the uniquely named earlier validated milestone receipt, and no generic issue creation, milestone mutation, or stale tracker-body replacement exists.
        - [ ] One `status:needs-brief` issue is created per selected component or concern.
        - [ ] Receipt-backed checklist and program-map entries capture every generated child/root/deferral, with policy-scoped `root-activation:v2` reactivation under the unique active policy where required.
        - [ ] Every new issue remains non-eligible until individually assessed against its exact fingerprint.
        - [ ] The decision record, every issue/milestone/comment expansion POST, closure comment, and issue-close PATCH predeclare one fixed request/attempt/outcome/result or receipt namespace. Exactly one of five common POST outcomes can claim each request: observed resource; authenticated winner/current-runtime response rejection with exact positive status and response-body-byte hash including deterministic empty body; winner-only `pre-send-not-sent`; request indeterminacy; or original-use-bound session-direct expiry. Every terminal non-resource form has null resource and no result, receipt, effect, success, retry, or later success adoption.
        - [ ] Recovery uses only `decision-record-ready`, `decision-output-ready`, `decision-receipt-ready`, `decision-expansion-completion-ready`, `decision-closure-ready`, `decision-issue-close-ready`, and `decision-finalization-ready`; inner hard-predicate substate/transition and outer option substate are byte-identical, and unprefixed aliases are invalid. A resource outcome enters receipt-ready and creates the canonical plan receipt; session-direct resource outcome/receipt publication is atomic in the receiving runtime.
        - [ ] The record, expansion or proven no-output effects, closure comment, fixed issue-close PATCH outcome, and final `decision-closure-result:v1` all validate. A sole rejected/not-sent/indeterminate/expiry common record, output, or closure outcome—or a dedicated close terminal—derives exact `decision-stop:v1` and `decision-stopped`, preserves successful prefix and later absence with ownership live, and can be consumed only by `abandon-decision`, never `resume`; its terminal result set binds the stop source plus later abandonment and `validateDecisionClosure` stays false.
        - [ ] No package implementation begins solely from this decision issue.
    validations:
      required: true

  - type: checkboxes
    id: safeguards
    attributes:
      label: Decision safeguards
      options:
        - label: The decision cannot silently move roadmap scope, exceed the accepted budget, narrow compatibility, or authorize publication ownership changes.
          required: true
        - label: Custom native code, materially impactful unapproved dependencies, tests/test infrastructure, and application responsibilities remain outside scope unless already accepted.
          required: true
        - label: Agent records identify agent actors; human authority carries the exact canonical subject statement and atomically consumed use ref, ordinary comments never become durable provenance, and one-use `session-direct-active-kiro-user` authority is same-runtime only. The receiving runtime alone may record a non-expiry authenticated response rejection, with exact status/body bytes and no resource/result/receipt/effect/retry. After the exact original use and positively authenticated immutable managed-runtime termination, ordinary record, expansion, closure-comment, and close operations permit only the fixed expiry-indeterminate outcome plus active-stop/mutex release—not rejection inferred later, success, result, receipt, effect, or retry.
          required: true
        - label: '`human-required` is used only when a canonical genuine escalation is concrete.'
          required: true
